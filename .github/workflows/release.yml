name: Release Binaries

on:
  release:
    types: [published]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: node18-linux-x64,node18-win-x64
          - os: macos-latest
            targets: node18-macos-x64,node18-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install PKG Globally
        run: npm install -g pkg esbuild

      - name: Bundle for Binary
        run: |
          mkdir -p bin-dist
          cat << 'EOF' > scripts/build-binary.js
          import { build } from 'esbuild';
          import { cpSync, rmSync, mkdirSync, writeFileSync } from 'fs';
          rmSync('./bin-dist', { recursive: true, force: true });
          mkdirSync('./bin-dist');
          await build({
            entryPoints: ['bin/cli.js'],
            bundle: true,
            platform: 'node',
            format: 'cjs',
            outfile: 'bin-dist/cli.cjs',
            minify: true,
          });
          writeFileSync('bin-dist/package.json', JSON.stringify({
            name: "omnicomplete",
            version: process.env.GITHUB_REF_NAME || "1.0.0",
            bin: "cli.cjs"
          }));
          cpSync('./src/specs', './bin-dist/specs', { recursive: true });
          EOF
          node scripts/build-binary.js

      - name: Compile Executables
        run: |
          mkdir -p release
          pkg ./bin-dist/package.json --targets ${{ matrix.targets }} --out-path release
          # Rename output binaries to standard convention
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            mv release/omnicomplete-linux release/omnicomplete-linux-x64 || true
            mv release/omnicomplete-win.exe release/omnicomplete-windows-x64.exe || true
          fi

      - name: Codesign and Notarize (macOS only)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Skipping codesigning because Apple Developer Secrets are missing."
            exit 0
          fi
          
          # Import Certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          
          # Sign the binaries
          for bin in release/omnicomplete-macos*; do
            codesign --force --options runtime --sign "Developer ID Application" --timestamp "$bin"
            
            # Notarize
            zip -j "$bin.zip" "$bin"
            xcrun notarytool submit "$bin.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            
            # Staple ticket
            xcrun stapler staple "$bin"
            rm "$bin.zip"
          done

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
