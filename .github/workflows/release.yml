name: Release Pipeline

on:
  push:
    branches:
      - main

# Ensure only one release runs at a time — queue subsequent pushes
concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  release:
    name: Auto Version and Publish
    runs-on: ubuntu-latest
    # Explicitly grant permissions to the default GITHUB_TOKEN so it can push back to main
    permissions:
      contents: write
    # Skip if this push was just our automated version bump
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Use default token for the main repo (permissions granted above)
          token: ${{ github.token }}
          # Fetch full history so we can pull/rebase
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Dependencies
        run: npm ci

      - name: Pull Latest Main
        run: |
          # Pull latest to avoid version conflicts when multiple commits land quickly
          git pull --rebase origin main

      - name: Bump Version
        id: bump
        run: |
          # Bump patch version and automatically commit with [skip ci]
          npm version patch -m "Bump version to %s [skip ci]"
          
          # Extract the new version to use in later steps
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped version to $NEW_VERSION"

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Fetch NPM Checksum
        id: checksum
        run: |
          # The NPM registry can take 15-30 seconds to fully propagate a newly published tarball.
          echo "Waiting 30 seconds for NPM registry propagation..."
          sleep 30
          
          TARBALL_URL="https://registry.npmjs.org/@lirimkrosa/omnicomplete/-/omnicomplete-${{ steps.bump.outputs.version }}.tgz"
          echo "Fetching checksum for: $TARBALL_URL"
          
          SHA256=$(curl -sL $TARBALL_URL | shasum -a 256 | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256 checksum is $SHA256"

      - name: Push Version Bump to Main
        run: |
          # Push the package.json version bump commit back to the main repository
          git push origin main

      - name: Checkout Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: lirimkrosa/homebrew-omnicomplete
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew Formula
        run: |
          cd homebrew-tap
          
          # Update version URL and sha256 in the formula
          sed -i -E "s|url \".*\"|url \"https://registry.npmjs.org/@lirimkrosa/omnicomplete/-/omnicomplete-${{ steps.bump.outputs.version }}.tgz\"|" Formula/omnicomplete.rb
          sed -i -E "s|sha256 \".*\"|sha256 \"${{ steps.checksum.outputs.sha256 }}\"|" Formula/omnicomplete.rb
          
          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/omnicomplete.rb
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Bump formula to ${{ steps.bump.outputs.version }} [skip ci]"
            git push origin main
          fi
